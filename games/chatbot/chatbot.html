<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chatbot</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link
		href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap"
		rel="stylesheet">
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #0f1117;
			--surface: #181c27;
			--border: #252a38;
			--text: #dde1ec;
			--text-dim: #5c6478;
			--text-muted: #383f52;
			--accent: #4fffb0;
			--accent2: #00c47a;
			--danger: #ff5f5f;
			--warn: #ffb84d;
			--radius: 18px;
			--mono: 'IBM Plex Mono', monospace;
			--sans: 'Inter', sans-serif;
		}

		html,
		body {
			height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: var(--sans);
			font-size: 14px;
			line-height: 1.6;
			overflow: hidden;
		}

		#app {
			display: grid;
			grid-template-rows: auto 3px auto auto 1fr auto auto;
			height: 100vh;
			max-width: 760px;
			margin: 0 auto;
		}

		header { grid-row: 1; }
		#progress-wrap { grid-row: 2; }
		#thread-warn { grid-row: 3; }
		#error-banner { grid-row: 4; }
		#messages { grid-row: 5; }
		#settings-row { grid-row: 6; }
		#input-area { grid-row: 7; }

		/* ── Header ── */
		header {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 13px 20px;
			border-bottom: 1px solid var(--border);
			background: var(--surface);
		}

		.logo {
			font-family: var(--mono);
			font-size: 13px;
			font-weight: 600;
			color: var(--accent);
			letter-spacing: .04em;
		}

		.logo span {
			color: var(--text-dim);
			font-weight: 400;
		}

		/* ── Progress ── */
		#progress-wrap {
			height: 3px;
			background: var(--border);
			overflow: hidden;
			transition: opacity .6s;
		}

		#progress-bar {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, var(--accent2), var(--accent));
			transition: width .3s ease;
			box-shadow: 0 0 8px var(--accent);
		}

		/* ── Error banner ── */
		#error-banner {
			display: none;
			margin: 14px 20px 0;
			padding: 12px 16px;
			background: rgba(255, 95, 95, .08);
			border: 1px solid rgba(255, 95, 95, .25);
			border-radius: 10px;
			color: var(--danger);
			font-family: var(--mono);
			font-size: 12px;
			white-space: pre-wrap;
		}

		/* ── Messages ── */
		#messages {
			overflow-y: auto;
			padding: 20px 16px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			scroll-behavior: smooth;
		}

		#messages::-webkit-scrollbar {
			width: 4px;
		}

		#messages::-webkit-scrollbar-thumb {
			background: var(--border);
			border-radius: 99px;
		}

		/* Chat bubble rows */
		.msg {
			display: flex;
			flex-direction: column;
			gap: 3px;
			animation: fadeUp .18s ease both;
			max-width: 78%;
		}

		.msg.user {
			align-self: flex-end;
			align-items: flex-end;
		}

		.msg.assistant {
			align-self: flex-start;
			align-items: flex-start;
		}

		@keyframes fadeUp {
			from {
				opacity: 0;
				transform: translateY(6px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.msg-label {
			font-family: var(--mono);
			font-size: 10px;
			letter-spacing: .08em;
			text-transform: uppercase;
			color: var(--text-muted);
			padding: 0 6px;
		}

		.msg.user .msg-label {
			color: var(--accent2);
		}

		.msg-body {
			padding: 10px 14px;
			font-size: 14px;
			white-space: pre-wrap;
			word-break: break-word;
			line-height: 1.65;
			border-radius: var(--radius);
		}

		/* User bubble: filled accent-tinted */
		.msg.user .msg-body {
			background: #1a2e28;
			border: 1px solid #1f4035;
			border-bottom-right-radius: 4px;
			color: #c6f0df;
		}

		/* Assistant bubble: subtle surface */
		.msg.assistant .msg-body {
			background: var(--surface);
			border: 1px solid var(--border);
			border-bottom-left-radius: 4px;
			color: var(--text);
		}

		.cursor {
			display: inline-block;
			width: 7px;
			height: 13px;
			background: var(--accent);
			vertical-align: middle;
			animation: blink .7s step-end infinite;
			border-radius: 1px;
			margin-left: 2px;
		}

		/* ── Splash ── */
		#splash {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 10px;
			height: 100%;
			color: var(--text-dim);
			text-align: center;
			padding: 40px;
		}

		#splash .big {
			font-size: 13px;
			font-family: var(--mono);
			color: var(--text);
		}

		#splash .sub {
			font-size: 12px;
			max-width: 380px;
			line-height: 1.7;
		}

		.spinner {
			width: 28px;
			height: 28px;
			border: 2px solid var(--border);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin .8s linear infinite;
			margin-bottom: 4px;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		/* ── Settings row ── */
		#settings-row {
			display: flex;
			gap: 12px;
			align-items: center;
			padding: 8px 16px;
			background: var(--surface);
			border-top: 1px solid var(--border);
			flex-wrap: wrap;
		}

		.setting-group {
			display: flex;
			align-items: center;
			gap: 7px;
			font-size: 12px;
			color: var(--text-dim);
		}

		.setting-group label {
			white-space: nowrap;
			font-weight: 500;
		}

		#creativity-label {
			font-size: 12px;
			color: var(--accent);
			font-weight: 600;
			min-width: 54px;
		}

		.setting-group input[type=range] {
			width: 90px;
			accent-color: var(--accent);
			cursor: pointer;
		}

		.setting-group select {
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 6px;
			color: var(--text);
			font-family: var(--sans);
			font-size: 12px;
			padding: 4px 8px;
			outline: none;
			cursor: pointer;
		}

		.setting-group select:focus {
			border-color: var(--accent2);
		}

		.hidden {
			display: none !important;
		}

		/* ── Input area ── */
		#input-area {
			padding: 10px 16px 14px;
			background: var(--surface);
			display: flex;
			gap: 8px;
			align-items: flex-end;
		}

		#prompt {
			flex: 1;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 20px;
			color: var(--text);
			font-family: var(--sans);
			font-size: 14px;
			padding: 10px 16px;
			resize: none;
			min-height: 42px;
			max-height: 140px;
			overflow-y: auto;
			outline: none;
			line-height: 1.5;
			transition: border-color .2s;
		}

		#prompt:focus {
			border-color: var(--accent2);
		}

		#prompt::placeholder {
			color: var(--text-muted);
		}

		#prompt:disabled {
			opacity: .4;
			cursor: not-allowed;
		}

		.btn {
			height: 40px;
			padding: 0 16px;
			border: 1px solid transparent;
			border-radius: 20px;
			font-family: var(--sans);
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: all .15s;
			white-space: nowrap;
			flex-shrink: 0;
		}

		.btn-send {
			background: var(--accent);
			color: #000;
			border-color: var(--accent);
		}

		.btn-send:hover:not(:disabled) {
			background: var(--accent2);
			border-color: var(--accent2);
		}

		.btn-send:disabled {
			opacity: .35;
			cursor: not-allowed;
		}

		.btn-stop {
			background: transparent;
			color: var(--danger);
			border-color: var(--danger);
		}

		.btn-stop:hover {
			background: rgba(255, 95, 95, .1);
		}

		.btn-clear {
			background: transparent;
			color: var(--text-dim);
			border-color: var(--border);
			font-size: 12px;
			height: 32px;
			border-radius: 16px;
			padding: 0 12px;
			margin-left: auto;
		}

		.btn-clear:hover {
			border-color: var(--text-dim);
			color: var(--text);
		}
	</style>
</head>

<body>
	<div id="app">

		<header>
			<div class="logo">Chatbot</div>
			<!-- <div id="status-pill">
				<div class="dot"></div><span id="status-text">initializing…</span>
			</div> -->
		</header>

		<div id="progress-wrap">
			<div id="progress-bar"></div>
		</div>

		<div id="error-banner"></div>

		<div id="messages">
			<div id="splash">
				<div class="spinner"></div>
				<div class="big">Loading model.gguf…</div>
				<div class="sub">The model is being fetched and initialized. This may take a minute depending on file
					size.</div>
			</div>
		</div>

		<div id="settings-row" class="hidden">
			<div class="setting-group">
				<label>Creativity</label>
				<span id="creativity-label">Balanced</span>
				<input type="range" id="temp-slider" min="0" max="2" step="0.05" value="0.7">
			</div>
			<div class="setting-group">
				<label>Length</label>
				<select id="n-predict">
					<option value="128">Short</option>
					<option value="512" selected>Medium</option>
					<option value="1024">Long</option>
					<option value="4096">Very long</option>
				</select>
			</div>
			<button class="btn btn-clear" id="btn-clear">clear chat</button>
		</div>

		<div id="input-area">
			<textarea id="prompt" placeholder="Send a message…" disabled rows="1"></textarea>
			<button class="btn btn-send" id="btn-send" disabled>Send</button>
			<button class="btn btn-stop hidden" id="btn-stop">Stop</button>
		</div>

	</div>
	<script type="module">
		import { Wllama } from './index.js';

		const CONFIG_PATHS = { default: './model.wasm' };

		const $messages = document.getElementById('messages');
		const $splash = document.getElementById('splash');
		const $prompt = document.getElementById('prompt');
		const $btnSend = document.getElementById('btn-send');
		const $btnStop = document.getElementById('btn-stop');
		const $btnClear = document.getElementById('btn-clear');
		const $statusPill = document.getElementById('status-pill');
		const $statusText = document.getElementById('status-text');
		const $progressBar = document.getElementById('progress-bar');
		const $progressWrap = document.getElementById('progress-wrap');
		const $errorBanner = document.getElementById('error-banner');
		const $settingsRow = document.getElementById('settings-row');
		const $tempSlider = document.getElementById('temp-slider');
		const $creLabel = document.getElementById('creativity-label');
		const $nPredict = document.getElementById('n-predict');

		let wllama = null, generating = false, stopRequested = false;

		const SYSTEM_MSG = { role: 'system', content: 'You are a helpful, concise assistant.' };
		const history = [{ ...SYSTEM_MSG }];

		const showError = msg => { $errorBanner.style.display = 'block'; $errorBanner.textContent = msg; };

		const CREATIVITY_LABELS = [
			[0, 0.2, 'Precise'],
			[0.2, 0.5, 'Focused'],
			[0.5, 0.9, 'Balanced'],
			[0.9, 1.3, 'Creative'],
			[1.3, 2.01, 'Wild'],
		];

		$tempSlider.addEventListener('input', () => {
			const v = parseFloat($tempSlider.value);
			const entry = CREATIVITY_LABELS.find(([lo, hi]) => v >= lo && v < hi);
			$creLabel.textContent = entry ? entry[2] : '';
		});

		function appendMessage(role, text = '') {
			const wrap = document.createElement('div');
			wrap.className = `msg ${role}`;
			wrap.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : 'Assistant'}</div><div class="msg-body"></div>`;
			$messages.appendChild(wrap);
			const body = wrap.querySelector('.msg-body');
			body.textContent = text;
			$messages.scrollTop = $messages.scrollHeight;
			return body;
		}

		function enableUI() {
			$splash.remove();
			$settingsRow.classList.remove('hidden');
			$prompt.disabled = false;
			$btnSend.disabled = false;
			$progressWrap.style.opacity = '0';
			setTimeout(() => $progressWrap.style.display = 'none', 600);
		}

		async function generate(userText) {
			if (generating || !wllama) return;
			generating = true; stopRequested = false;

			history.push({ role: 'user', content: userText });
			appendMessage('user', userText);

			const assistantBody = appendMessage('assistant', '');
			const cursor = Object.assign(document.createElement('span'), { className: 'cursor' });
			assistantBody.appendChild(cursor);

			$prompt.disabled = true;
			$btnSend.classList.add('hidden');
			$btnStop.classList.remove('hidden');

			let assembled = '';
			try {
				const stream = await wllama.createChatCompletion({
					messages: history,
					max_tokens: parseInt($nPredict.value, 10) || 512,
					temperature: parseFloat($tempSlider.value),
					top_k: 40,
					frequency_penalty: 1.3,
					stream: true,
				});

				for await (const chunk of stream) {
					if (stopRequested) break;
					const delta = chunk.choices[0]?.delta?.content ?? '';
					assembled += delta;
					assistantBody.textContent = assembled;
					assistantBody.appendChild(cursor);
					$messages.scrollTop = $messages.scrollHeight;
				}
			} catch (err) {
				assembled = '[generation error: ' + err.message + ']';
				assistantBody.textContent = assembled;
				console.error(err);
			}

			cursor.remove();
			const finalText = assembled.trim();
			if (finalText) {
				assistantBody.textContent = finalText;
				history.push({ role: 'assistant', content: finalText });
			} else if (!assembled) {
				assistantBody.textContent = '[no output]';
			}

			generating = false;
			$prompt.disabled = false;
			$btnSend.classList.remove('hidden');
			$btnStop.classList.add('hidden');
			$prompt.focus();
		}

		$btnSend.addEventListener('click', () => {
			const text = $prompt.value.trim();
			if (!text) return;
			$prompt.value = ''; $prompt.style.height = '';
			generate(text);
		});

		$prompt.addEventListener('keydown', e => {
			if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $btnSend.click(); }
		});

		$prompt.addEventListener('input', () => {
			$prompt.style.height = 'auto';
			$prompt.style.height = Math.min($prompt.scrollHeight, 140) + 'px';
		});

		$btnStop.addEventListener('click', () => {
			stopRequested = true;
			$btnStop.disabled = true;
			$btnStop.textContent = 'Stopping…';
		});

		$btnClear.addEventListener('click', () => {
			history.length = 0;
			history.push({ ...SYSTEM_MSG });
			[...$messages.querySelectorAll('.msg')].forEach(el => el.remove());
		});

		(async () => {
			try {
				wllama = new Wllama(CONFIG_PATHS, {
					logger: { debug: () => { }, log: (...a) => console.log('[wllama]', ...a), warn: (...a) => console.warn('[wllama]', ...a), error: (...a) => console.error('[wllama]', ...a) }
				});

				const modelUrl = new URL('./model.gguf', window.location.href).href;

				await wllama.loadModelFromUrl(modelUrl, {
					progressCallback: ({ loaded, total }) => {
						if (total > 0) {
							const pct = Math.round((loaded / total) * 100);
							$progressBar.style.width = pct + '%';
							const big = $splash?.querySelector('.big');
							if (big) big.textContent = `Loading… ${pct}% (${Math.round(loaded / 1048576)} / ${Math.round(total / 1048576)} MB)`;
						}
					},
				});

				enableUI();
			} catch (err) {
				console.error(err);
				showError(`Failed to load model:\n${err.message}\n\nMake sure:\n  • Serving from HTTP (not file://)\n  • model.gguf is in the same folder\n  • Model is ≤ 2GB`);
				$splash?.remove();
			}
		})();
	</script>
</body>

</html>
