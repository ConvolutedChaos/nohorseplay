<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OS X 10.11.6</title>
    <meta name="description" content="An interactive OS X El Capitan desktop in the browser.">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="assets/icons/32/Finder.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/menubar.css">
    <link rel="stylesheet" href="css/menus.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/window.css">
    <link rel="stylesheet" href="css/finder.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/dock.css">
    <link rel="stylesheet" href="css/launchpad.css">
    <link rel="stylesheet" href="css/mission.css">
    <link rel="stylesheet" href="css/spotlight.css">
    <link rel="stylesheet" href="css/notification-center.css">
    <link rel="stylesheet" href="css/boot.css">
    <link rel="stylesheet" href="css/cursors.css">
</head>

<body>
    <!-- .locked holds the bar, icons and Dock back until someone logs in -->
    <div id="screen" class="locked">
        <div id="wallpaper"></div>

        <!-- icons live here; windows float above them -->
        <div id="desktop"></div>
        <div id="windows"></div>

        <!-- Launchpad covers the bar, icons and windows but not the Dock -->
        <div id="launchpad" class="hidden">
            <div class="lp-wall"></div>
            <div id="lpStage">
                <div id="lpPage"></div>
                <div id="lpSearch">
                    <span class="glass">
                        <svg viewBox="0 0 12 12">
                            <circle cx="4.9" cy="4.9" r="3.9" fill="none" stroke="currentColor" stroke-width="1.4" />
                            <path d="M7.7 7.7 11.2 11.2" fill="none" stroke="currentColor" stroke-width="1.6"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <input id="lpInput" type="text" placeholder="Search" spellcheck="false" autocomplete="off">
                    <span id="lpClear">
                        <svg viewBox="0 0 14 14">
                            <mask id="lpClearCut">
                                <rect width="14" height="14" fill="#fff" />
                                <path d="M4.5 4.5l5 5m0-5l-5 5" stroke="#000" stroke-width="1.6"
                                    stroke-linecap="round" />
                            </mask>
                            <circle cx="7" cy="7" r="7" fill="rgba(255,255,255,.42)" mask="url(#lpClearCut)" />
                        </svg>
                    </span>
                </div>
                <div id="lpFolder" class="hidden">
                    <div id="lpFolderTitle"></div>
                    <div id="lpFolderPanel"></div>
                </div>
            </div>
        </div>

        <!-- Mission Control: the Spaces bar and a stand-in for each window -->
        <div id="mc" class="hidden">
            <div id="mcHits"></div>
            <div id="mcBar">
                <div id="mcNames"></div>
                <div id="mcThumbs"></div>
                <div id="mcAdd">
                    <div class="peek"></div>
                    <div class="disc"></div>
                    <i class="plus"></i>
                </div>
            </div>
        </div>

        <div id="dock"></div>

        <!-- Notification Center slides in over everything but the bar -->
        <div id="nc" class="vibrant-dark">
            <div id="ncTabs">
                <div class="tab on" data-tab="today">Today</div>
                <div class="tab" data-tab="notifications">Notifications</div>
            </div>
            <div id="ncBody"></div>
            <div id="ncFoot">
                <div class="new"><i></i>1 New</div>
                <div class="dnd"></div>
            </div>
        </div>

        <div id="menubar" class="vibrant-light">
            <div id="mbLeft"></div>
            <div id="mbRight"></div>
        </div>

        <!-- Spotlight, hidden until summoned -->
        <div id="spotlight" class="vibrant-light hidden">
            <div id="spotField">
                <svg viewBox="0 0 16 16">
                    <path
                        d="M6.8 1a5.8 5.8 0 104.6 9.3l3.2 3.2 1-1-3.2-3.2A5.8 5.8 0 006.8 1zm0 1.4a4.4 4.4 0 11-4.4 4.4 4.4 4.4 0 014.4-4.4z" />
                </svg>
                <input id="spotInput" type="text" placeholder="Spotlight Search" spellcheck="false"
                    autocomplete="off">
                <div id="spotHitIcon"></div>
            </div>
            <div id="spotResults" class="hidden">
                <div id="spotList"></div>
                <div id="spotPreview"></div>
            </div>
        </div>

        <div id="banners"></div>

        <!-- every menu, submenu and popup is parented here -->
        <div id="menuLayer" class="idle">
            <div id="menuShield"></div>
        </div>

        <!-- power on, the boot screen and the login window (js/boot.js) -->
        <div id="boot"></div>

        <!-- sleep / restart / shut down -->
        <div id="veil"></div>
    </div>

    <script src="js/icon-manifest.js"></script>
    <script src="js/cursor-data.js"></script>
    <script src="js/cursors.js"></script>
    <script src="js/core.js"></script>
    <script src="js/fs.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/windows.js"></script>
    <script src="js/finder.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/about.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/menubar.js"></script>
    <script src="js/extras.js"></script>
    <script src="js/genie.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/spaces.js"></script>
    <script src="js/launchpad.js"></script>
    <script src="js/mission.js"></script>
    <script src="js/spotlight.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/boot.js"></script>
    <script src="js/start.js"></script>
</body>

</html>
